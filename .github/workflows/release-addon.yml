name: Release de l'addon

# Pousser un tag addon-vX.Y.Z (identique à « ## Version » du .toc) crée une release GitHub
# avec PexGuideExport-X.Y.Z.zip, prête à décompresser dans Interface\AddOns.
on:
  push:
    tags: ["addon-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version du tag = version du TOC
        run: |
          tag="${GITHUB_REF_NAME#addon-v}"
          toc="$(grep -m1 '^## Version:' addon/PexGuideExport/PexGuideExport.toc | awk '{print $3}')"
          if [ "$tag" != "$toc" ]; then
            echo "Le tag ($tag) ne correspond pas au TOC ($toc)."
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          cd addon
          zip -r "../PexGuideExport-${VERSION}.zip" PexGuideExport

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "PexGuideExport-${VERSION}.zip" \
            --title "Pex Guide Export ${VERSION}" --generate-notes
