name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests, lint et données
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Tests du lecteur SavedVariables
        run: npm test

      - name: Fiches publiées valides
        run: npm run validate

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test de fumée de l'addon (API WoW simulée)
        run: |
          pip install lupa==2.8
          python addon/tests/smoke_test.py

      # Action officielle lunarmodules (image Docker) : pas de dépendance aux miroirs apt d'Ubuntu.
      - name: Luacheck de l'addon
        uses: lunarmodules/luacheck@v1
        with:
          args: addon/PexGuideExport
